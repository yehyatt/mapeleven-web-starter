<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapeleven web starter</title>
  <link rel="stylesheet" href="https://mapeleven.dev/sdk/web/0.2.0/mapeleven.css" />
  <link rel="stylesheet" href="style.css" />
  <!-- MapLibre is a peer dependency of the SDK; the import map tells the browser where it is. -->
  <script type="importmap">
    { "imports": { "maplibre-gl": "https://cdn.jsdelivr.net/npm/maplibre-gl@6.16.0/dist/maplibre-gl.mjs" } }
  </script>
</head>
<body>
  <div id="map"></div>

  <div class="panel">
    <input id="q" type="search" placeholder="ابحث عن مكان" autocomplete="off" dir="auto" />
    <button id="lang" title="English">EN</button>
    <ul id="results" hidden></ul>
    <p id="here" hidden></p>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
